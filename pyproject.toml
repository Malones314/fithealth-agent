[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fithealth-agent"
version = "0.1.0"
description = "Local fitness and health management agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["fithealth_agent"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
